<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sentinel AML</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous"
  >
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  >
  <!--
    Brand theme: applied purely by overriding Bootstrap's own theme variables.
    Deep navy primary + vivid orange accent on light neutral surfaces.
  -->
  <style>
    :root {
      --brand-navy: #1a2b6b;
      --brand-navy-600: #223684;
      --brand-navy-700: #142255;
      --brand-orange: #f47b20;
      --brand-orange-600: #e06a12;
      --brand-surface: #f5f6f9;

      --bs-primary: var(--brand-navy);
      --bs-primary-rgb: 26, 43, 107;
      --bs-link-color: var(--brand-navy);
      --bs-link-color-rgb: 26, 43, 107;
      --bs-link-hover-color: var(--brand-navy-700);
      --bs-body-bg: var(--brand-surface);
      --bs-border-color: #e2e6ee;
    }

    body {
      background-color: var(--brand-surface);
    }

    /* Themed Bootstrap primary buttons to the brand navy */
    .btn-primary {
      --bs-btn-bg: var(--brand-navy);
      --bs-btn-border-color: var(--brand-navy);
      --bs-btn-hover-bg: var(--brand-navy-600);
      --bs-btn-hover-border-color: var(--brand-navy-600);
      --bs-btn-active-bg: var(--brand-navy-700);
      --bs-btn-active-border-color: var(--brand-navy-700);
      --bs-btn-disabled-bg: var(--brand-navy);
      --bs-btn-disabled-border-color: var(--brand-navy);
    }
    .btn-outline-primary {
      --bs-btn-color: var(--brand-navy);
      --bs-btn-border-color: var(--brand-navy);
      --bs-btn-hover-bg: var(--brand-navy);
      --bs-btn-hover-border-color: var(--brand-navy);
      --bs-btn-active-bg: var(--brand-navy);
      --bs-btn-active-border-color: var(--brand-navy);
    }
    .text-primary { color: var(--brand-navy) !important; }
    .border-primary { border-color: var(--brand-navy) !important; }
    .bg-primary { background-color: var(--brand-navy) !important; }

    /* Accent helpers driven by brand orange */
    .text-accent { color: var(--brand-orange) !important; }
    .bg-accent { background-color: var(--brand-orange) !important; }
    .border-accent { border-color: var(--brand-orange) !important; }

    /* Dark navy sidebar surface with light content, themed via Bootstrap vars */
    .brand-sidebar {
      background-color: var(--brand-navy);
      --bs-body-color: rgba(255, 255, 255, 0.85);
      --bs-border-color: rgba(255, 255, 255, 0.12);
    }
    .brand-sidebar .nav-link {
      --bs-nav-link-color: rgba(255, 255, 255, 0.75);
      --bs-nav-link-hover-color: #fff;
    }
    .brand-sidebar .nav-link:hover {
      background-color: rgba(255, 255, 255, 0.08);
    }
    .brand-sidebar .nav-link.active {
      --bs-nav-pills-link-active-bg: var(--brand-orange);
      color: #fff;
    }
  </style>
</head>
<body class="bg-body" data-bs-theme="light">
  <app-root></app-root>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"
  ></script>
</body>
</html>
